configuration:
  iding_phone:
    name: iding – telefon
    description: Telefonní číslo, kterým se přihlašuješ na iding.tw (např. 0912345678).
  iding_password:
    name: iding – heslo
    description: >-
      Heslo k účtu iding.tw. Pokud se přihlašuješ jen přes LINE, nastav si v účtu heslo.
      Telefony uživatelů se přiřazují přímo na stránce doplňku (sekce pro administrátory).
